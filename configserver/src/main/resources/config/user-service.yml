server:
  port: 8081

spring:
  datasource:
    #url: jdbc:mysql://localhost:3306/fitness-user-db
    #url: jdbc:mysql://mysql:3306/fittrack
    #url: jdbc:mysql://mysql.fittrack.local:3306/fittrack
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
#    username: ${MYSQL_USER}
#    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


eureka:
  client:
    serviceUrl:
      #defaultZone: http://eureka-server:8761/eureka/
      defaultZone: http://eureka-server.fittrack.local:8761/eureka/
  instance:
    hostname: user-service.fittrack.local
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}


