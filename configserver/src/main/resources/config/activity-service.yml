#spring.application.name=activityService
server:
  port: 8082

spring:
  datasource:
    #url: jdbc:mysql://mysql.fittrack.local:3306/fittrack
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  rabbitmq:
    //host: rabbitmq
    host: rabbitmq.fittrack.local
    port: 5672
    username: guest
    password: guest

  application:
    name: activity-service

eureka:
  client:
    serviceUrl:
      #defaultZone: http://eureka-server:8761/eureka
      defaultZone: http://eureka-server.fittrack.local:8761/eureka
  instance:
    hostname: activity-service.fittrack.local
    prefer-ip-address: false
    nonSecurePort: ${server.port}
    instance-id: ${spring.application.name}:${server.port}

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
  delete:
    queue: activity.deleted.queue
    routingKey: activity.deleted


